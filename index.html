<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Network reporting concept</title><style> *{box-sizing:border-box}body{margin:0;background:#141414;color:#eee;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}#app{max-width:460px;margin:auto;min-height:100vh;padding:12px 15px 100px}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;margin:15px 0 24px}header button{background:#303030;border-radius:50%;width:40px;height:40px;font-size:24px}.card{background:#262626;border-radius:23px;padding:16px;margin:14px 0}.row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #484848;width:100%;text-align:left}.row:last-child{border:0}.grow{flex:1}small{display:block;color:#aaa;margin-top:5px;font-size:12px}.blue{color:#72a5ff}.notice{background:#172b51;color:#a9c8ff;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#292929;border-radius:18px;padding:14px;text-align:left}.tile b{display:block;font-size:24px}nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(92%,430px);background:#303030;border-radius:40px;display:flex;justify-content:space-around;padding:12px 0}nav button{font-size:12px}nav span{display:block;font-size:23px}.tag{font-size:11px;color:#b9c9e3;text-align:center;letter-spacing:1px;padding:8px;background:#192332;border-radius:8px}.hours{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}.hours button{padding:0;font-size:10px}.hours i{display:block;height:35px;border-radius:4px;margin-bottom:5px}.bar{display:flex;height:32px;background:#454545;border-radius:8px;overflow:hidden}.ticks{display:flex;justify-content:space-between;font-size:10px;color:#bbb}input{background:#292929;color:white;border:1px solid #555;border-radius:12px;padding:10px;width:100%}h3{margin:0 0 10px;font-size:18px}body{background:#0e0e10;color:#f6f6f8;font-size:15px}#app{padding:0 14px 105px}.status{display:flex;justify-content:space-between;padding:14px 15px 5px;font-size:14px;background:#131a28;margin:0 -14px}header{margin:0 -14px 16px;padding:12px 16px 17px;background:linear-gradient(120deg,#202d45,#101b30);border-bottom:1px solid #303a4b}header b{font-size:20px}header button{background:linear-gradient(140deg,#415371,#253148);border:1px solid #52617b}.card{background:linear-gradient(145deg,#292b30,#202124);border:1px solid #34363c;box-shadow:0 3px 12px #0003;border-radius:22px;padding:16px;margin:12px 0}.row{padding:13px 0;border-color:#41434a}.row small{font-size:12px;line-height:1.35}.tile{background:linear-gradient(145deg,#343740,#282a30);border:1px solid #3b3e46;border-radius:13px;padding:11px;text-align:center}.tile b{font-size:18px;margin-top:5px}.summary{grid-template-columns:repeat(3,1fr)}.appicon{display:inline-grid;place-items:center;flex:none;width:35px;height:35px;border-radius:10px;background:var(--bg);color:var(--fg);vertical-align:middle}.appicon svg{width:23px;height:23px}.tile .appicon{margin:auto}.hours{margin:14px 0}.hours i{background-image:linear-gradient(#ffffff22,transparent)!important}.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:#c8c8cc;margin-top:10px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}nav{border:1px solid #505158;background:linear-gradient(#343438,#262629);box-shadow:0 4px 24px #0008}nav svg{width:24px;height:24px;display:block;margin:0 auto 4px}nav button:nth-child(2){color:#75a9ff}em{font-size:10px;font-style:normal;color:#aab9cf;font-weight:400;float:right}.bar{margin:12px 0 6px;background:#41454f}.ticks{margin-bottom:8px}.notice{background:#172b51}.tabs{display:flex;border:1px solid #52627c;border-radius:12px;padding:3px;margin:12px 0}.tabs button{flex:1;padding:8px;font-size:12px}.tabs button:first-child{background:#2866bd;border-radius:9px}</style></head><body><div id="app"><div class="status"><b>11:53</b><span>▮▮▮ 5G ▰</span></div><header><button onclick="back()">‹</button><b id="title"></b><button onclick="go('home')">···</button></header><div class="tag" style="position:sticky;top:0;z-index:10;margin-bottom:12px">Illustrative prototype · fictional activity</div><main id="main"></main><nav><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('devices')"><span>▣</span>Devices</button><button onclick="go('settings')"><span>⚙</span>Settings</button><button onclick="go('support')"><span>ⓘ</span>Support</button></nav></div><script>
let p='home',stack=[],hour=19,chosen=0;const E=[['Browsing','08:12','09:06','#388df7'],['Phone call','09:18','09:34','#8cb96b'],['WhatsApp messages','09:41','10:07','#21c963'],['Waze session','10:37','10:59','#48cde5'],['Yahoo Mail','11:26','11:54','#a57aef'],['SMS / iMessage','13:47','14:03','#d295ed'],['WhatsApp messages','14:18','14:44','#21c963'],['Phone call','15:10','15:30','#8cb96b'],['Waze session','16:00','16:20','#48cde5'],['WhatsApp messages','16:27','16:49','#21c963'],['WhatsApp call (Video)','18:54','18:57','#12bfa6'],['WhatsApp call (Video)','19:04','19:05','#12bfa6'],['WhatsApp voice note','19:06','19:07','#21c963'],['WhatsApp messages','19:09','19:12','#21c963'],['Browsing','21:14','23:01','#388df7']];const m=t=>{let a=t.split(':').map(Number);return a[0]*60+a[1]},card=s=>`<section class="card">${s}</section>`,row=(a,b,d,ico='▯')=>`<button class="row" onclick="go('${d}')">${icon(a)}<span class="grow">${a}<small>${b}</small></span>›</button>`;function icon(n){let k=n.toLowerCase(),c='#65a8ff',bg='#263b52',d='<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/>';if(k.includes('whatsapp')){c='#fff';bg='#1cb65a';d=k.includes('voice note')?'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>':k.includes('video')?'<rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/>':'<path d="M5 19 3 21l1-5a9 9 0 1 1 4 4z"/><path d="m8 7 2 3-1 1q2 4 5 4l1-2 3 2q-1 4-5 2-6-2-7-8z"/>'}else if(k.includes('waze')){c='#102e38';bg='#56d8ed';d='<path fill="white" d="M4 14C0 14 2 20 9 20h6a8 8 0 1 0-8-8z"/><circle cx="10" cy="10" r=".7"/><circle cx="15" cy="10" r=".7"/><path d="M10 14q3 3 6 0"/><circle cx="8" cy="20" r="2"/><circle cx="16" cy="20" r="2"/>'}else if(k.includes('yahoo')){c='#fff';bg='#6331b9';d='<path stroke-width="3" d="m4 6 5 8m6-8-8 15m12-15-2 9m0 4h.1"/>'}else if(k.includes('sms')||k.includes('imessage')){c='#d59af6';bg='#40304e';d='<path d="M4 4h16v12H10l-5 4v-4H4zM8 10h.1m4 0h.1m4 0h.1"/>'}else if(k.includes('phone call')){c='#73e395';bg='#28483a';d='<path d="m5 3 4 1 2 5-3 2q2 4 5 5l2-3 5 2 1 4q-2 4-8 1Q3 15 3 7z"/>'}else if(k.includes('iphone')||k.includes('device')){d='<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>'}return `<span class="appicon" style="--fg:${c};--bg:${bg}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg></span>`}function legend(){return '<div class="legend">'+[['Browsing','#388df7'],['Calls','#8cb96b'],['WhatsApp','#21c963'],['Waze','#48cde5'],['Yahoo Mail','#a57aef'],['Messages','#d295ed']].map(x=>`<span><i style="background:${x[1]}"></i>${x[0]}</span>`).join('')+'</div>'}function go(x){stack.push(p);p=x;render()}function back(){p=stack.pop()||'home';render()}function ev(e){return `<button class="row" onclick="chosen=${E.indexOf(e)};go('event')">${icon(e[0])}<span class="grow">${e[0]}<small>${e[1]} – ${e[2]} · ${m(e[2])-m(e[1])} min</small></span>›</button>`}function hours(){return `<div class="hours">${Array.from({length:16},(_,i)=>i+8).map(h=>`<button onclick="hour=${h};go('hour')"><i style="background:${E.find(e=>m(e[1])<(h+1)*60&&m(e[2])>h*60)?.[3]||'#454545'};${h===hour?'outline:2px solid white':''}"></i>${h}</button>`).join('')}</div>`}function render(){document.getElementById('title').textContent=({home:'My network',devices:'Devices',offline:'Devices',first:'Device',second:'Device',past:'Past sessions',hour:'Past sessions',event:'Session details',active:'Active sessions'})[p]||p;let s='';if(p==='home')s=card('<h3>Example network</h3><small style="color:#45d6a0">● Online</small>'+row('Internet','Provided by your ISP','devices','◎')+row('Bedroom & Main Router','Gateway eero','devices','▰')+row('Living Room','eero','devices','▰'))+'<h3>Devices</h3><div class="grid"><button class="tile" onclick="go(\'devices\')">Online<b>17</b></button><button class="tile" onclick="go(\'offline\')">Offline<b>6</b></button></div>'+card('<h3>Profiles</h3>Unassigned · Devices')+card('<h3>Security & privacy +</h3>Scans　 Threats　 Ads');if(p==='devices'||p==='offline')s='<small>17 online · 6 offline</small><p><input placeholder="Search" oninput="document.querySelectorAll(\'.device\').forEach(x=>x.hidden=!x.innerText.toLowerCase().includes(this.value.toLowerCase()))"></p><small>All　 Sort　 Networks　 Profiles　 Connection</small><p>Results · Offline</p>'+card([['Indoor Cam v2','','other'],['iPad','','other'],['iPhone','DEMO-A7K29X · Unassigned','first'],['iPhone','iPhone 16 Pro Max · Maria · M32G3F2K9X (fictional)','second'],['Watch','','other'],['Smart light','','other']].map(x=>'<div class="device">'+row(...x)+'</div>').join(''));if(p==='first'||p==='second'){let b=p==='second';s='<div class="card notice">ⓘ Private devices behave a little differently from other devices.<small>Learn more</small></div>'+card('<div class="row"><span class="appicon" style="--fg:#eee;--bg:#30343b">▯</span><div class="grow">iPhone<small>'+(b?'iPhone 16 Pro Max':'Apple iPhone')+'</small></div><span class="blue">Edit</span></div><div class="row"><span class="grow">Profile</span><small>'+(b?'Maria':'Unassigned')+'</small></div><div class="row"><span class="grow">Allow on backup</span><span style="color:#13c69a">●</span></div><div class="blue" style="padding-top:15px">Pause device</div>')+card('<div class="row"><div class="grow">Connection<small>Offline</small></div>◉</div><div class="row"><div class="grow">Device information<small>'+(b?'Serial number: M32G3F2K9X (fictional)':'DEMO-A7K29X')+'</small></div>›</div><div class="row">Reservations & port forwarding</div>')+(b?card('<h3>Sessions <small>Activity grouped into sessions</small></h3>'+row('Active sessions','0 active','active','◉')+row('Past sessions','View activity history','past','◷')):'')+card('<div style="display:flex;justify-content:space-between"><div>Received<small>65.3 MB</small></div><div style="color:#c58cb7">▇▂▁▁▁</div><div>Sent<small>1.1 GB</small></div><div style="color:#16b9d3">▇▂▁▁▁</div></div>')+card('Security & privacy +');}if(p==='active')s=card('No active sessions'+row('Past sessions','Activity history','past'));if(p==='past')s=card('<h3>Saturday, 21 November 2026</h3><small>Tap an hour</small><div class="tabs"><button>Day</button><button onclick="go(\'hour\')">Hour</button><button onclick="go(\'hour\')">10 min</button></div><div class="grid summary" style="margin-top:12px">'+[['Browsing','161m'],['Phone calls','36m'],['WhatsApp messages','77m'],['Yahoo Mail','28m'],['Waze','42m'],['WhatsApp calls','4m'],['SMS / iMessage','16m']].map(x=>'<div class="tile">'+icon(x[0])+'<small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><p>Daily timeline (hourly)</p>'+hours()+legend())+card('<h3>Session history</h3>'+E.map(ev).join(''));if(p==='hour'){let a=hour*60,b=a+60,es=E.filter(e=>m(e[1])<b&&m(e[2])>a),pos=a,bar='';for(let e of es){let x=Math.max(a,m(e[1])),y=Math.min(b,m(e[2]));bar+=`<div style="width:${(x-pos)/60*100}%"></div><div style="width:${(y-x)/60*100}%;background:${e[3]}"></div>`;pos=y}bar+=`<div style="width:${(b-pos)/60*100}%"></div>`;s=card('<h3>Hourly timeline</h3>'+hours()+legend())+card(`<div class="row"><button onclick="hour=(hour+23)%24;render()">‹</button><b class="grow">${hour}:00 – ${hour+1}:00</b><button onclick="hour=(hour+1)%24;render()">›</button></div><p>10-minute detail</p><div class="bar">${bar}</div><div class="ticks">${[0,10,20,30,40,50,60].map(x=>'<span>'+(hour+Math.floor(x/60))+':'+String(x%60).padStart(2,'0')+'</span>').join('')}</div>`)+card('<h3>Sessions in this hour</h3>'+(es.map(ev).join('')||'No sample activity'));}if(p==='event'){let e=E[chosen];s=card(`<h3>${e[0]}</h3><p>Start: ${e[1]}</p><p>End: ${e[2]}</p><p>Duration: ${m(e[2])-m(e[1])} minutes</p><small>Classification is illustrative. No participants, message contents or routes.</small>`)}document.getElementById('main').innerHTML=s||card('Outside prototype scope');window.scrollTo(0,0)}render();</script></body></html>
