<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Network reporting concept</title><style> *{box-sizing:border-box}body{margin:0;background:#141414;color:#eee;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}#app{max-width:460px;margin:auto;min-height:100vh;padding:12px 15px 100px}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;margin:15px 0 24px}header button{background:#303030;border-radius:50%;width:40px;height:40px;font-size:24px}.card{background:#262626;border-radius:23px;padding:16px;margin:14px 0}.row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #484848;width:100%;text-align:left}.row:last-child{border:0}.grow{flex:1}small{display:block;color:#aaa;margin-top:5px;font-size:12px}.blue{color:#72a5ff}.notice{background:#172b51;color:#a9c8ff;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#292929;border-radius:18px;padding:14px;text-align:left}.tile b{display:block;font-size:24px}nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(92%,430px);background:#303030;border-radius:40px;display:flex;justify-content:space-around;padding:12px 0}nav button{font-size:12px}nav span{display:block;font-size:23px}.tag{font-size:11px;color:#b9c9e3;text-align:center;letter-spacing:1px;padding:8px;background:#192332;border-radius:8px}.hours{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}.hours button{padding:0;font-size:10px}.hours i{display:block;height:35px;border-radius:4px;margin-bottom:5px}.bar{display:flex;height:32px;background:#454545;border-radius:8px;overflow:hidden}.ticks{display:flex;justify-content:space-between;font-size:10px;color:#bbb}input{background:#292929;color:white;border:1px solid #555;border-radius:12px;padding:10px;width:100%}h3{margin:0 0 10px;font-size:18px}</style></head><body><div id="app"><div class="tag">PRODUCT CONCEPT · SIMULATED DATA</div><header><button onclick="back()">‹</button><b id="title"></b><button onclick="go('home')">···</button></header><main id="main"></main><nav><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('devices')"><span>▣</span>Devices</button><button onclick="go('settings')"><span>⚙</span>Settings</button><button onclick="go('support')"><span>ⓘ</span>Support</button></nav></div><script>
let p='home',stack=[],hour=19,chosen=0;const E=[['Browsing','08:12','09:06','#388df7'],['Phone call (illustrative)','09:18','09:34','#8cb96b'],['WhatsApp messages','09:41','10:07','#21c963'],['Waze session','10:37','10:59','#48cde5'],['Yahoo Mail','11:26','11:54','#a57aef'],['SMS / iMessage (illustrative)','13:47','14:03','#d295ed'],['WhatsApp messages','14:18','14:44','#21c963'],['Phone call (illustrative)','15:10','15:30','#8cb96b'],['Waze session','16:00','16:20','#48cde5'],['WhatsApp messages','16:27','16:49','#21c963'],['WhatsApp call (Voice)','19:02','19:04','#21c963'],['WhatsApp call (Video)','19:05','19:08','#12bfa6'],['WhatsApp messages','19:09','19:12','#21c963'],['Browsing','21:14','23:01','#388df7']];const m=t=>{let a=t.split(':').map(Number);return a[0]*60+a[1]},card=s=>`<section class="card">${s}</section>`,row=(a,b,d,ico='▯')=>`<button class="row" onclick="go('${d}')"><span>${ico}</span><span class="grow">${a}<small>${b}</small></span>›</button>`;function go(x){stack.push(p);p=x;render()}function back(){p=stack.pop()||'home';render()}function ev(e){return `<button class="row" onclick="chosen=${E.indexOf(e)};go('event')"><span style="color:${e[3]}">●</span><span class="grow">${e[0]}<small>${e[1]} – ${e[2]} · ${m(e[2])-m(e[1])} min</small></span>›</button>`}function hours(){return `<div class="hours">${Array.from({length:16},(_,i)=>i+8).map(h=>`<button onclick="hour=${h};go('hour')"><i style="background:${E.find(e=>m(e[1])<(h+1)*60&&m(e[2])>h*60)?.[3]||'#454545'};${h===hour?'outline:2px solid white':''}"></i>${h}</button>`).join('')}</div>`}function render(){document.getElementById('title').textContent=({home:'My network',devices:'Devices',offline:'Devices',first:'Device',second:'Device',past:'Past sessions',hour:'Past sessions',event:'Session details',active:'Active sessions'})[p]||p;let s='';if(p==='home')s=card('<h3>WiFiFoFun</h3><small style="color:#45d6a0">● Online</small>'+row('Internet','Provided by your ISP','devices','◎')+row('Bedroom & Main Router','Gateway eero','devices','▰')+row('Living Room','eero','devices','▰'))+'<h3>Devices</h3><div class="grid"><button class="tile" onclick="go(\'devices\')">Online<b>17</b></button><button class="tile" onclick="go(\'offline\')">Offline<b>6</b></button></div>'+card('<h3>Profiles</h3>Unassigned · Devices')+card('<h3>Security & privacy +</h3>Scans　 Threats　 Ads');if(p==='devices'||p==='offline')s='<small>17 online · 6 offline</small><p><input placeholder="Search" oninput="document.querySelectorAll(\'.device\').forEach(x=>x.hidden=!x.innerText.toLowerCase().includes(this.value.toLowerCase()))"></p><small>All　 Sort　 Networks　 Profiles　 Connection</small><p>Results · Offline</p>'+card([['Indoor Cam v2','','other'],['iPad','','other'],['iPhone','DEMO-A7K29X · Unassigned','first'],['iPhone','DEMO-B4M82Q · Maria (sample profile)','second'],['Watch','','other'],['Smart light','','other']].map(x=>'<div class="device">'+row(...x)+'</div>').join(''));if(p==='first'||p==='second'){let b=p==='second';s='<div class="card notice">ⓘ Private devices behave a little differently from other devices.<small>Learn more</small></div>'+card('<div class="row">▯ <div class="grow">iPhone<small>Apple iPhone</small></div><span class="blue">Edit</span></div><div class="row"><span class="grow">Profile</span><small>'+(b?'Maria (sample profile)':'Unassigned')+'</small></div><div class="row"><span class="grow">Allow on backup</span><span style="color:#13c69a">●</span></div><div class="blue" style="padding-top:15px">Pause device</div>')+card('<div class="row"><div class="grow">Connection<small>Offline</small></div>◉</div><div class="row"><div class="grow">Device information<small>'+(b?'DEMO-B4M82Q':'DEMO-A7K29X')+'</small></div>›</div><div class="row">Reservations & port forwarding</div>')+(b?card('<h3>Sessions <small>Proposed feature · simulated</small></h3>'+row('Active sessions','0 active','active','◉')+row('Past sessions','Explore sample history','past','◷')):'')+card('<div style="display:flex;justify-content:space-between"><div>Received<small>65.3 MB</small></div><div style="color:#c58cb7">▇▂▁▁▁</div><div>Sent<small>1.1 GB</small></div><div style="color:#16b9d3">▇▂▁▁▁</div></div>')+card('Security & privacy +');}if(p==='active')s=card('No active sessions'+row('Past sessions','Sample history','past'));if(p==='past')s=card('<h3>Saturday, 21 November 2026</h3><small>Fictional activity timeline · tap an hour</small><div class="grid" style="margin-top:12px">'+[['Browsing','161m'],['Phone calls','36m'],['WhatsApp messages','77m'],['Yahoo Mail','28m'],['Waze','42m'],['WhatsApp calls','5m'],['SMS / iMessage','16m']].map(x=>'<div class="tile"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><p>Daily timeline (hourly)</p>'+hours())+card('<h3>Session history</h3>'+E.map(ev).join(''));if(p==='hour'){let a=hour*60,b=a+60,es=E.filter(e=>m(e[1])<b&&m(e[2])>a),pos=a,bar='';for(let e of es){let x=Math.max(a,m(e[1])),y=Math.min(b,m(e[2]));bar+=`<div style="width:${(x-pos)/60*100}%"></div><div style="width:${(y-x)/60*100}%;background:${e[3]}"></div>`;pos=y}bar+=`<div style="width:${(b-pos)/60*100}%"></div>`;s=card('<h3>Hourly timeline</h3>'+hours())+card(`<div class="row"><button onclick="hour=(hour+23)%24;render()">‹</button><b class="grow">${hour}:00 – ${hour+1}:00</b><button onclick="hour=(hour+1)%24;render()">›</button></div><p>10-minute detail</p><div class="bar">${bar}</div><div class="ticks">${[0,10,20,30,40,50,60].map(x=>'<span>'+(hour+Math.floor(x/60))+':'+String(x%60).padStart(2,'0')+'</span>').join('')}</div>`)+card('<h3>Sessions in this hour</h3>'+(es.map(ev).join('')||'No sample activity'));}if(p==='event'){let e=E[chosen];s=card(`<h3>${e[0]}</h3><small>Fictional sample · not a network record</small><p>Start: ${e[1]}</p><p>End: ${e[2]}</p><p>Duration: ${m(e[2])-m(e[1])} minutes</p><small>Classification is illustrative. No participants, message contents or routes.</small>`)}document.getElementById('main').innerHTML=s||card('Outside prototype scope');window.scrollTo(0,0)}render();</script></body></html>
